<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <rect width="32" height="32" fill="#000000"/>
    <!--
      2G YAW true cube.
      Unit cube, y-up. 30-degree isometric:
        sx = (x - z) * sqrt(3)/2
        sy = y + (x + z)/2
      That formula is already a 45-degree yaw around Y (azimuth) plus
      30-degree elevation, so a vertical corner leads. Equal 3D edges.
      Square faces. 90-degree corners. Square viewBox. Not 1A EVEN.
    -->
    <g stroke="#FF6A00" stroke-width="1.25" fill="none" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M16 6 L24.6603 11 L24.6603 21 L16 26 L7.3397 21 L7.3397 11 Z"/>
        <path d="M16 16 L16 26"/>
        <path d="M16 16 L24.6603 11"/>
        <path d="M16 16 L7.3397 11"/>
    </g>
</svg>

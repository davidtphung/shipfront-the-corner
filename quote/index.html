<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | Shipfront</title>
    <meta name="description" content="Request a quote for Shipfront fulfillment services.">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>

    <header role="banner">
        <nav role="navigation" aria-label="Main navigation">
            <a href="../" class="logo" aria-label="Shipfront home">
                <svg class="mark" width="24" height="26" viewBox="0 0 24 26" aria-hidden="true">
                    <polygon fill="#000000" points="12,6 17,9 12,12 7,9"/>
                    <polygon fill="#000000" points="7,9 12,12 12,19 7,16"/>
                    <polygon fill="#000000" points="17,9 12,12 12,19 17,16"/>
                    <g fill="none" stroke="#FF6A00" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter">
                        <path d="M7 9 L12 6 L17 9 L12 12 Z"/>
                        <path d="M7 9 L7 16 L12 19 L17 16 L17 9"/>
                        <path d="M12 12 L12 19"/>
                        <path d="M12 6 L12 13 L7 16"/>
                        <path d="M12 13 L17 16"/>
                    </g>
                </svg>
                <span class="wordmark-bar">SHIPFRONT</span>
            </a>
            <ul class="nav-links">
                <li><a href="../#why">Why Shipfront</a></li>
                <li><a href="../contact/">Contact</a></li>
                <li><a href="../quote/" class="cta-button" aria-current="page">Get a Quote</a></li>
            </ul>
        </nav>
    </header>

    <main id="main" role="main">
        <section class="form-page">
            <div class="form-container">
                <p class="eyebrow">Get a Quote</p>
                <h1>Fast &amp; Easy Quotes</h1>
                <p class="form-intro">Please take a moment to give us some information. We have expert agents standing by to take care of your logistics needs.</p>

                <form id="quote-form" class="quote-form" novalidate>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required aria-required="true" autocomplete="name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required aria-required="true" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="company">Company</label>
                        <input type="text" id="company" name="company" required aria-required="true" autocomplete="organization">
                    </div>

                    <button type="submit" class="cta-button">Get a Quote</button>
                </form>

                <div id="form-message" class="form-message" role="status" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <p>Built by David T Phung</p>
    </footer>

    <script src="../script.js"></script>
</body>
</html>

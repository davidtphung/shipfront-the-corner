<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | Shipfront</title>
    <meta name="description" content="Request a quote for Shipfront fulfillment services.">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css?v=yaw2g">
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="ground-grid" aria-hidden="true"></div>
    <div class="canvas-grain" aria-hidden="true"></div>

    <header class="site-head" role="banner">
        <nav aria-label="Main navigation">
            <a href="../" class="logo" aria-label="Shipfront home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <g stroke="#FF6A00" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter">
                        <path d="M8 8 L15 5 L20 10 L20 16 L13 19 L8 14 Z"/>
                        <path d="M8 8 L13 11 L20 10"/>
                        <path d="M13 11 L13 19"/>
                        <path d="M8 14 L13 11 L20 16"/>
                    </g>
                </svg>
                <span class="wordmark">SHIPFRONT</span>
            </a>
            <ul class="nav-links">
                <li><a href="../#why">Why Shipfront</a></li>
                <li><a href="../contact/">Contact</a></li>
                <li><a href="../quote/" class="cta" aria-current="page">Get a Quote</a></li>
            </ul>
        </nav>
    </header>

    <main id="main" class="page-shell">
        <div class="page-head">
            <div class="band-inner reveal">
                <p class="eyebrow">Quote</p>
                <h1>Get a quote</h1>
                <p class="band-lead">Name, email, and company. This preview does not send. Use info@myshipfront.com if you want the note to land.</p>
            </div>
        </div>
        <div class="page-panel">
            <form id="quote-form" class="quote-form" novalidate>
                <div class="form-group">
                    <label for="name">NAME</label>
                    <input id="name" name="name" type="text" required aria-required="true">
                </div>
                <div class="form-group">
                    <label for="email">EMAIL</label>
                    <input id="email" name="email" type="email" required aria-required="true">
                </div>
                <div class="form-group">
                    <label for="company">COMPANY</label>
                    <input id="company" name="company" type="text" required aria-required="true">
                </div>
                <div class="form-pin">
                    <button type="submit" class="cta">Submit request <span class="cta-arrow" aria-hidden="true">→</span></button>
                    <div id="form-message" class="form-message" role="status" aria-live="polite"></div>
                </div>
            </form>
        </div>
    </main>

    <footer role="contentinfo">
        <div class="footer-inner">
            <p class="footer-mark">SHIPFRONT</p>
            <div class="footer-cols">
                <div class="footer-col">
                    <h3>Home</h3>
                    <a href="../">Home</a>
                </div>
                <div class="footer-col">
                    <h3>Quote</h3>
                    <a href="../quote/">Get a Quote</a>
                </div>
                <div class="footer-col">
                    <h3>Contact</h3>
                    <a href="../contact/">Contact</a>
                </div>
            </div>
        </div>
        <p class="footer-credit">Built by David T Phung</p>
    </footer>
    <script src="../script.js"></script>
</body>
</html>

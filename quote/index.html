<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | Shipfront</title>
    <meta name="description" content="Request a quote for Shipfront fulfillment services.">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>

    <header role="banner">
        <nav role="navigation" aria-label="Main navigation">
            <a href="../" class="logo" aria-label="Shipfront home">
                <svg class="mark" width="20" height="23" viewBox="25 25 70 100" aria-hidden="true">
                    <g stroke="#FF6A00" stroke-width="1.25" fill="none" stroke-linecap="square" stroke-linejoin="miter">
                        <path d="M30,45 L60,30 L90,45 L90,75 L60,90 L30,75 Z"/>
                        <path d="M30,75 L30,105"/>
                        <path d="M60,90 L60,120"/>
                        <path d="M90,75 L90,105"/>
                        <path d="M30,105 L60,120"/>
                        <path d="M60,120 L90,105"/>
                        <path d="M90,105 L30,105"/>
                        <path d="M30,45 L30,75"/>
                        <path d="M60,30 L60,90"/>
                        <path d="M90,45 L90,75"/>
                        <path d="M30,75 L60,90"/>
                        <path d="M60,90 L90,75"/>
                    </g>
                </svg>
                <span class="wordmark">SHIPFRONT</span>
            </a>
            <ul class="nav-links">
                <li><a href="../#why">Why Shipfront</a></li>
                <li><a href="../contact/">Contact</a></li>
                <li><a href="../quote/" class="cta-button" aria-current="page">Get a Quote</a></li>
            </ul>
        </nav>
    </header>

    <main id="main" role="main">
        <section class="form-page">
            <div class="form-container">
                <p class="eyebrow">QUOTE</p>
                <h1>GET A QUOTE</h1>
                <p class="form-intro">Name, email, and company. This preview does not send. Use info@myshipfront.com if you want the note to land.</p>

                <form id="quote-form" class="quote-form" novalidate>
                    <div class="form-group">
                        <label for="name">NAME</label>
                        <input type="text" id="name" name="name" required aria-required="true">
                    </div>

                    <div class="form-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" required aria-required="true">
                    </div>

                    <div class="form-group">
                        <label for="company">COMPANY</label>
                        <input type="text" id="company" name="company" required aria-required="true">
                    </div>

                    <button type="submit" class="cta-button">SUBMIT REQUEST</button>
                </form>

                <div id="form-message" class="form-message" role="status" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <p>Built by David T Phung</p>
    </footer>

    <script src="../script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | Shipfront</title>
    <meta name="description" content="Request a quote for Shipfront fulfillment services.">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>

    <header role="banner">
        <nav role="navigation" aria-label="Main navigation">
            <a href="../" class="logo" aria-label="Shipfront home">
                <svg class="mark" width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
                    <g stroke="#FF6A00" stroke-width="1.25" fill="none" stroke-linecap="square" stroke-linejoin="miter">
                        <path d="M16 6 L24.6603 11 L24.6603 21 L16 26 L7.3397 21 L7.3397 11 Z"/>
                        <path d="M16 16 L16 26"/>
                        <path d="M16 16 L24.6603 11"/>
                        <path d="M16 16 L7.3397 11"/>
                    </g>
                </svg>
                <span class="wordmark">SHIPFRONT</span>
            </a>
            <ul class="nav-links">
                <li><a href="../#why">Why Shipfront</a></li>
                <li><a href="../contact/">Contact</a></li>
                <li><a href="../quote/" class="cta-button" aria-current="page">Get a Quote</a></li>
            </ul>
        </nav>
    </header>

    <main id="main" role="main">
        <section class="form-page">
            <div class="form-container">
                <p class="eyebrow">QUOTE</p>
                <h1>GET A QUOTE</h1>
                <p class="form-intro">Name, email, and company. This preview does not send. Use info@myshipfront.com if you want the note to land.</p>

                <form id="quote-form" class="quote-form" novalidate>
                    <div class="form-group">
                        <label for="name">NAME</label>
                        <input type="text" id="name" name="name" required aria-required="true">
                    </div>

                    <div class="form-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" required aria-required="true">
                    </div>

                    <div class="form-group">
                        <label for="company">COMPANY</label>
                        <input type="text" id="company" name="company" required aria-required="true">
                    </div>

                    <button type="submit" class="cta-button">SUBMIT REQUEST</button>
                </form>

                <div id="form-message" class="form-message" role="status" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <p>Built by David T Phung</p>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
